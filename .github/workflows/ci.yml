name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and desktop extra
        run: python -m pip install ".[desktop]"
      - name: Verify desktop-notifier API
        run: python -c "from desktop_notifier import DesktopNotifierSync, Urgency; print('desktop extra ok')"
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Validate Unix installers
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n scripts/install-linux.sh scripts/install-macos.sh
      - name: Validate Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/install-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Out-String | Write-Error
            exit 1
          }
      - name: CLI smoke test
        run: |
          reset-guardian --version
          reset-guardian --help
