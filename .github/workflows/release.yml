name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "$expected"
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Codex Reset Guardian $GITHUB_REF_NAME"
