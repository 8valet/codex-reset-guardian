name: Bug report
description: Report a reproducible problem in Codex Reset Guardian
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include account IDs, reset-credit IDs, cookies, tokens, webhook URLs, or private IP addresses.**
  - type: input
    id: version
    attributes:
      label: Guardian version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands or configuration with all secrets and identifiers redacted.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only logs you have reviewed and redacted.
      render: text
