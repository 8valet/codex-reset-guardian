name: Feature request
description: Suggest an improvement or new integration
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep requests focused. Do not include private account data, reset IDs, notification credentials, or private network information.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem would this feature solve for you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or alternative designs you have considered.
